<svg width="400" height="80" viewBox="0 0 400 80" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="horizOceanGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#003D82" />
    </linearGradient>
    <radialGradient id="horizTankGradient" cx="40%" cy="40%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </radialGradient>
  </defs>

  <!-- Logo circle background -->
  <circle cx="40" cy="40" r="38" fill="url(#horizOceanGradient)" />
  <circle cx="40" cy="40" r="37" stroke="#FCD34D" stroke-width="1.5" fill="none" opacity="0.5" />

  <!-- Diver (scaled down for horizontal layout) -->
  <g transform="translate(40, 28)">
    <!-- Head/Helmet -->
    <circle cx="0" cy="0" r="8" fill="#000" opacity="0.2" />
    <circle cx="0" cy="0" r="6.5" fill="#1a1a1a" opacity="0.95" stroke="#FCD34D" stroke-width="0.8" />
    <!-- Visor -->
    <ellipse cx="0" cy="-0.5" rx="5" ry="4" fill="#4FC3F7" opacity="0.6" />
    <!-- Eyes -->
    <circle cx="-2.5" cy="-0.5" r="0.8" fill="white" opacity="0.8" />
    <circle cx="2.5" cy="-0.5" r="0.8" fill="white" opacity="0.8" />
  </g>

  <!-- Body -->
  <ellipse cx="40" cy="42" rx="5.5" ry="9" fill="#2a2a2a" opacity="0.9" />

  <!-- Arms -->
  <ellipse cx="28" cy="38" rx="3" ry="7.5" fill="#2a2a2a" opacity="0.85" transform="rotate(-30 28 38)" />
  <ellipse cx="52" cy="38" rx="3" ry="7.5" fill="#2a2a2a" opacity="0.85" transform="rotate(30 52 38)" />

  <!-- Legs -->
  <ellipse cx="35" cy="55" rx="3" ry="9" fill="#2a2a2a" opacity="0.85" transform="rotate(-10 35 55)" />
  <ellipse cx="45" cy="55" rx="3" ry="9" fill="#2a2a2a" opacity="0.85" transform="rotate(10 45 55)" />

  <!-- Fin blades -->
  <ellipse cx="33" cy="67" rx="5" ry="2.5" fill="#DC2626" opacity="0.8" transform="rotate(-20 33 67)" />
  <ellipse cx="47" cy="67" rx="5" ry="2.5" fill="#DC2626" opacity="0.8" transform="rotate(20 47 67)" />

  <!-- Tank -->
  <g transform="translate(18, 35)">
    <rect x="-2.5" y="-2" width="5" height="14" rx="1.5" fill="url(#horizTankGradient)" opacity="0.9" />
    <rect x="-1.8" y="-3.5" width="3.6" height="2" rx="0.8" fill="#666" opacity="0.7" />
  </g>

  <!-- Compass -->
  <g transform="translate(60, 40)">
    <circle cx="0" cy="0" r="5" fill="#DEB887" opacity="0.8" stroke="#8B4513" stroke-width="0.4" />
    <text x="0" y="-2.8" font-size="3" font-weight="bold" fill="#8B4513" text-anchor="middle" dominant-baseline="middle">N</text>
    <line x1="0" y1="0" x2="0" y2="-3.5" stroke="#DC2626" stroke-width="0.8" />
  </g>

  <!-- Air bubbles -->
  <circle cx="25" cy="22" r="1.8" fill="white" opacity="0.5" />
  <circle cx="55" cy="18" r="1.2" fill="white" opacity="0.4" />
  <circle cx="22" cy="50" r="1.2" fill="white" opacity="0.45" />
  <circle cx="58" cy="48" r="1" fill="white" opacity="0.42" />

  <!-- Text "DiveLog" -->
  <text x="120" y="56" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#001A4D" letter-spacing="-1">DiveLog</text>
  
  <!-- Decorative accent line under text -->
  <line x1="120" y1="62" x2="280" y2="62" stroke="#06B6D4" stroke-width="2" opacity="0.4" />
</svg>
