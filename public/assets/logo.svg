<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="50%">
      <stop offset="0%" stop-color="#87CEEB" />
      <stop offset="100%" stop-color="#E0F6FF" />
    </linearGradient>
    <linearGradient id="oceanGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#003D82" />
    </linearGradient>
    <linearGradient id="sandGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DEB887" />
      <stop offset="100%" stop-color="#D2B48C" />
    </linearGradient>
    <radialGradient id="tankGradient" cx="40%" cy="40%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </radialGradient>
  </defs>

  <!-- Outer ring border -->
  <circle cx="256" cy="256" r="250" stroke="#001A4D" stroke-width="8" fill="none" opacity="0.3" />
  <circle cx="256" cy="256" r="242" stroke="#FCD34D" stroke-width="2" fill="none" opacity="0.6" />

  <!-- Background - Sky and Ocean -->
  <circle cx="256" cy="256" r="242" fill="url(#oceanGradient)" />
  <path d="M 0 256 Q 128 200 256 220 T 512 256 L 512 0 L 0 0 Z" fill="url(#skyGradient)" />

  <!-- Water line with wave effect -->
  <path d="M 0 256 Q 64 240 128 250 T 256 256 T 384 250 T 512 256" stroke="#87CEEB" stroke-width="3" fill="none" opacity="0.4" />
  
  <!-- Sand/Bottom -->
  <path d="M 0 380 Q 128 360 256 370 T 512 380 L 512 512 L 0 512 Z" fill="url(#sandGradient)" opacity="0.9" />

  <!-- Coral and sea life at bottom -->
  <!-- Red Coral -->
  <g transform="translate(120, 420)">
    <rect x="-8" y="0" width="16" height="60" rx="8" fill="#DC2626" opacity="0.8" />
    <ellipse cx="-20" cy="20" rx="12" ry="18" fill="#EF4444" opacity="0.7" />
    <ellipse cx="20" cy="30" rx="14" ry="20" fill="#DC2626" opacity="0.7" />
    <ellipse cx="-18" cy="50" rx="10" ry="16" fill="#FCA5A5" opacity="0.6" />
    <ellipse cx="18" cy="50" rx="12" ry="18" fill="#EF4444" opacity="0.7" />
  </g>

  <!-- Starfish -->
  <g transform="translate(420, 420)">
    <circle cx="0" cy="0" r="28" fill="#F97316" opacity="0.8" />
    <circle cx="-35" cy="-15" r="22" fill="#EA580C" opacity="0.7" />
    <circle cx="35" cy="-15" r="22" fill="#EA580C" opacity="0.7" />
    <circle cx="-20" cy="35" r="22" fill="#EA580C" opacity="0.7" />
    <circle cx="20" cy="35" r="22" fill="#EA580C" opacity="0.7" />
    <circle cx="0" cy="-40" r="20" fill="#FDBA74" opacity="0.6" />
  </g>

  <!-- Shell -->
  <g transform="translate(80, 450)">
    <ellipse cx="0" cy="0" rx="20" ry="25" fill="#F5DEB3" opacity="0.9" />
    <path d="M -15 -20 Q -10 -5 -8 5" stroke="#DEB887" stroke-width="2" fill="none" />
    <path d="M -8 -20 Q -3 -5 -2 5" stroke="#DEB887" stroke-width="2" fill="none" />
    <path d="M 0 -20 Q 5 -5 8 5" stroke="#DEB887" stroke-width="2" fill="none" />
    <path d="M 8 -20 Q 13 -5 15 5" stroke="#DEB887" stroke-width="2" fill="none" />
  </g>

  <!-- Clownfish -->
  <g transform="translate(350, 330)">
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="22" ry="14" fill="#FF6B35" opacity="0.9" />
    <!-- Stripes -->
    <ellipse cx="-8" cy="0" rx="6" ry="16" fill="white" opacity="0.9" />
    <ellipse cx="8" cy="0" rx="6" ry="16" fill="white" opacity="0.9" />
    <!-- Tail -->
    <ellipse cx="28" cy="0" rx="12" ry="18" fill="#FF6B35" opacity="0.8" />
    <!-- Eye -->
    <circle cx="-15" cy="-5" r="3" fill="#000" />
  </g>

  <!-- Diving cylinder/tank -->
  <g transform="translate(100, 200)">
    <!-- Tank body -->
    <rect x="-12" y="-8" width="24" height="50" rx="8" fill="url(#tankGradient)" opacity="0.95" />
    <!-- Tank valve -->
    <rect x="-8" y="-15" width="16" height="8" rx="2" fill="#666" opacity="0.8" />
    <!-- Pressure gauge -->
    <circle cx="0" cy="-10" r="4" fill="#333" opacity="0.6" />
    <!-- Tank bottom -->
    <ellipse cx="0" cy="42" rx="12" ry="4" fill="#D97706" opacity="0.8" />
    <!-- Lines -->
    <line x1="-8" y1="5" x2="-8" y2="25" stroke="#D97706" stroke-width="2" opacity="0.6" />
    <line x1="8" y1="5" x2="8" y2="25" stroke="#D97706" stroke-width="2" opacity="0.6" />
  </g>

  <!-- Compass at left -->
  <g transform="translate(90, 280)">
    <circle cx="0" cy="0" r="18" fill="#DEB887" opacity="0.9" stroke="#8B4513" stroke-width="1" />
    <!-- N marking -->
    <text x="0" y="-12" font-size="10" font-weight="bold" fill="#8B4513" text-anchor="middle" alignment-baseline="middle">N</text>
    <!-- Cardinal points -->
    <line x1="0" y1="-16" x2="0" y2="-10" stroke="#8B4513" stroke-width="2" />
    <!-- Needle -->
    <line x1="0" y1="0" x2="0" y2="-14" stroke="#DC2626" stroke-width="2" />
  </g>

  <!-- Depth gauge -->
  <g transform="translate(410, 280)">
    <rect x="-14" y="-16" width="28" height="32" rx="3" fill="#333" opacity="0.9" stroke="#FCD34D" stroke-width="1.5" />
    <text x="0" y="-6" font-size="8" font-weight="bold" fill="#FCD34D" text-anchor="middle">18:2m</text>
    <text x="0" y="6" font-size="8" font-weight="bold" fill="#FCD34D" text-anchor="middle">22°</text>
  </g>

  <!-- Diver in water -->
  <g transform="translate(256, 150)">
    <!-- Head/Helmet -->
    <circle cx="0" cy="-8" r="20" fill="#000" opacity="0.2" />
    <circle cx="0" cy="-8" r="16" fill="#1a1a1a" opacity="0.9" stroke="#FCD34D" stroke-width="1.5" />
    <!-- Glass/visor -->
    <ellipse cx="0" cy="-10" rx="12" ry="10" fill="#4FC3F7" opacity="0.6" />
    <!-- Eyes behind visor -->
    <circle cx="-6" cy="-10" r="2" fill="white" opacity="0.8" />
    <circle cx="6" cy="-10" r="2" fill="white" opacity="0.8" />
    
    <!-- Body/Wetsuit -->
    <ellipse cx="0" cy="15" rx="14" ry="26" fill="#1a1a1a" opacity="0.9" />
    
    <!-- Arms -->
    <ellipse cx="-20" cy="10" rx="7" ry="20" fill="#2a2a2a" opacity="0.85" transform="rotate(-30 -20 10)" />
    <ellipse cx="20" cy="10" rx="7" ry="20" fill="#2a2a2a" opacity="0.85" transform="rotate(30 20 10)" />
    
    <!-- Legs/Fins -->
    <ellipse cx="-10" cy="48" rx="8" ry="24" fill="#2a2a2a" opacity="0.85" transform="rotate(-15 -10 48)" />
    <ellipse cx="10" cy="48" rx="8" ry="24" fill="#2a2a2a" opacity="0.85" transform="rotate(15 10 48)" />
    
    <!-- Fin blades -->
    <ellipse cx="-12" cy="68" rx="12" ry="6" fill="#DC2626" opacity="0.8" transform="rotate(-20 -12 68)" />
    <ellipse cx="12" cy="68" rx="12" ry="6" fill="#DC2626" opacity="0.8" transform="rotate(20 12 68)" />
  </g>

  <!-- Island with palm tree at top right - Sky area -->
  <g transform="translate(380, 80)">
    <!-- Island -->
    <ellipse cx="0" cy="8" rx="35" ry="12" fill="#DEB887" opacity="0.8" />
    <!-- Palm trunk -->
    <rect x="-2" y="-25" width="4" height="30" rx="2" fill="#8B4513" opacity="0.8" />
    <!-- Palm leaves -->
    <g transform="translate(0, -30)">
      <path d="M -3 0 Q -15 -15 -20 -30" stroke="#22863A" stroke-width="3" fill="none" opacity="0.8" stroke-linecap="round" />
      <path d="M 0 -5 Q -10 -20 -15 -35" stroke="#22863A" stroke-width="3" fill="none" opacity="0.8" stroke-linecap="round" />
      <path d="M 3 0 Q 15 -15 20 -30" stroke="#22863A" stroke-width="3" fill="none" opacity="0.8" stroke-linecap="round" />
      <path d="M 0 -5 Q 10 -20 15 -35" stroke="#22863A" stroke-width="3" fill="none" opacity="0.8" stroke-linecap="round" />
    </g>
  </g>

  <!-- Boat on horizon -->
  <g transform="translate(320, 110)">
    <!-- Hull -->
    <path d="M -20 5 L -15 15 L 15 15 L 20 5 Z" fill="#8B4513" opacity="0.7" />
    <!-- Boat body -->
    <path d="M -18 5 L -15 -5 L 15 -5 L 18 5 Z" fill="#DC2626" opacity="0.8" />
    <!-- Mast -->
    <line x1="0" y1="-5" x2="0" y2="-20" stroke="#8B4513" stroke-width="1.5" opacity="0.7" />
    <!-- Sail -->
    <path d="M 0 -4 L 12 -16 L 12 2 Z" fill="#FFF" opacity="0.6" />
  </g>

  <!-- Air bubbles scattered -->
  <circle cx="200" cy="220" r="6" fill="white" opacity="0.5" />
  <circle cx="310" cy="200" r="4" fill="white" opacity="0.4" />
  <circle cx="180" cy="300" r="5" fill="white" opacity="0.45" />
  <circle cx="330" cy="320" r="3.5" fill="white" opacity="0.42" />
  <circle cx="220" cy="380" r="4" fill="white" opacity="0.38" />

  <!-- Center text: "DiveLog" -->
  <text x="256" y="265" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="white" text-anchor="middle" opacity="0.95" stroke="#001A4D" stroke-width="0.5">DiveLog</text>
</svg>
