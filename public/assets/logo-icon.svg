<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="iconOceanGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#003D82" />
    </linearGradient>
    <radialGradient id="iconTankGradient" cx="40%" cy="40%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </radialGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="128" cy="128" r="128" fill="url(#iconOceanGradient)" />
  
  <!-- Border accent -->
  <circle cx="128" cy="128" r="124" stroke="#FCD34D" stroke-width="2" fill="none" opacity="0.5" />

  <!-- Diver centered -->
  <g transform="translate(128, 85)">
    <!-- Head/Helmet -->
    <circle cx="0" cy="0" r="12" fill="#000" opacity="0.2" />
    <circle cx="0" cy="0" r="10" fill="#1a1a1a" opacity="0.95" stroke="#FCD34D" stroke-width="1" />
    <!-- Visor -->
    <ellipse cx="0" cy="-1" rx="7" ry="6" fill="#4FC3F7" opacity="0.6" />
    <!-- Eyes -->
    <circle cx="-3.5" cy="-1" r="1.2" fill="white" opacity="0.8" />
    <circle cx="3.5" cy="-1" r="1.2" fill="white" opacity="0.8" />
  </g>

  <!-- Body -->
  <ellipse cx="128" cy="105" rx="8" ry="14" fill="#2a2a2a" opacity="0.9" />

  <!-- Arms -->
  <ellipse cx="110" cy="100" rx="4" ry="11" fill="#2a2a2a" opacity="0.85" transform="rotate(-30 110 100)" />
  <ellipse cx="146" cy="100" rx="4" ry="11" fill="#2a2a2a" opacity="0.85" transform="rotate(30 146 100)" />

  <!-- Legs -->
  <ellipse cx="122" cy="125" rx="4.5" ry="13" fill="#2a2a2a" opacity="0.85" transform="rotate(-10 122 125)" />
  <ellipse cx="134" cy="125" rx="4.5" ry="13" fill="#2a2a2a" opacity="0.85" transform="rotate(10 134 125)" />

  <!-- Fin blades -->
  <ellipse cx="120" cy="143" rx="7" ry="3.5" fill="#DC2626" opacity="0.8" transform="rotate(-20 120 143)" />
  <ellipse cx="136" cy="143" rx="7" ry="3.5" fill="#DC2626" opacity="0.8" transform="rotate(20 136 143)" />

  <!-- Diving tank (simplified) -->
  <g transform="translate(70, 95)">
    <rect x="-3.5" y="-3" width="7" height="18" rx="2" fill="url(#iconTankGradient)" opacity="0.9" />
    <rect x="-2.5" y="-5" width="5" height="3" rx="1" fill="#666" opacity="0.7" />
  </g>

  <!-- Compass -->
  <g transform="translate(185, 100)">
    <circle cx="0" cy="0" r="6.5" fill="#DEB887" opacity="0.8" stroke="#8B4513" stroke-width="0.5" />
    <text x="0" y="-4" font-size="4" font-weight="bold" fill="#8B4513" text-anchor="middle" dominant-baseline="middle">N</text>
    <line x1="0" y1="0" x2="0" y2="-5" stroke="#DC2626" stroke-width="1" />
  </g>

  <!-- Corals (simplified) -->
  <g transform="translate(50, 180)">
    <ellipse cx="0" cy="0" rx="4" ry="6" fill="#DC2626" opacity="0.7" />
    <ellipse cx="-7" cy="3" rx="3" ry="4" fill="#EF4444" opacity="0.6" />
    <ellipse cx="7" cy="3" rx="3" ry="4" fill="#EF4444" opacity="0.6" />
  </g>

  <!-- Starfish -->
  <g transform="translate(200, 180)">
    <circle cx="0" cy="0" r="6" fill="#F97316" opacity="0.7" />
    <circle cx="-9" cy="-4" r="4" fill="#EA580C" opacity="0.6" />
    <circle cx="9" cy="-4" r="4" fill="#EA580C" opacity="0.6" />
    <circle cx="-5" cy="8" r="4" fill="#EA580C" opacity="0.6" />
    <circle cx="5" cy="8" r="4" fill="#EA580C" opacity="0.6" />
    <circle cx="0" cy="-10" r="3.5" fill="#FDBA74" opacity="0.5" />
  </g>

  <!-- Air bubbles -->
  <circle cx="95" cy="145" r="2.5" fill="white" opacity="0.5" />
  <circle cx="165" cy="160" r="1.8" fill="white" opacity="0.4" />
  <circle cx="75" cy="120" r="2" fill="white" opacity="0.45" />
  <circle cx="185" cy="140" r="1.5" fill="white" opacity="0.42" />
</svg>
